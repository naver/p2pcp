name: Release

on:
  release:
    types: [published]

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      short-sha: ${{ steps.check.outputs.short-sha }}
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check tag against VERSION
        id: check
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(make -s print-version)
          # A SemVer prerelease suffix (3.0.0-rc1) ships without bumping VERSION; metadata-action makes no image tags for a non-SemVer one.
          ident='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if [[ ! "$TAG" =~ ^${version//./\\.}(-${ident}(\.${ident})*)?$ ]]; then
            echo "::error::release tag '$TAG' does not match VERSION '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short-sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Decide whether the image gets latest
        id: latest
        # bash adds pipefail, so a failed ls-remote fails the step instead of silently leaving latest off.
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Only the highest stable version gets latest, so prereleases and backports leave it alone.
          latest=false
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            highest=$(git ls-remote --tags --refs origin | sed 's|.*refs/tags/||' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
            [ "$TAG" = "$highest" ] && latest=true
            echo "highest stable tag: $highest"
          fi
          echo "latest=$latest"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

  download-ci-artifact:
    needs: [check-version]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Download CI artifact
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: ci.yml
          commit: ${{ github.sha }}
          name: p2pcp-binary-${{ matrix.arch }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Re-upload CI artifact for use in this workflow
      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: p2pcp-binary-${{ matrix.arch }}
          path: p2pcp

  deploy:
    needs: [download-ci-artifact]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download binary
        uses: actions/download-artifact@v7
        with:
          name: p2pcp-binary-${{ matrix.arch }}

      - name: Set executable permission
        run: chmod +x p2pcp

      - name: Create release archive
        env:
          TAG: ${{ github.event.release.tag_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          PACKAGE_NAME="p2pcp-${TAG}-linux-${ARCH}"
          mkdir -p "${PACKAGE_NAME}"
          cp p2pcp README.md LICENSE NOTICE "${PACKAGE_NAME}/"
          tar czf "${PACKAGE_NAME}.tar.gz" "${PACKAGE_NAME}"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          ARCH: ${{ matrix.arch }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" "p2pcp-${TAG}-linux-${ARCH}.tar.gz" \
            --repo "$REPO" \
            --clobber

  build-and-push-image:
    # Push only images whose commit passed CI, including the image smoke test.
    needs: [check-version, download-ci-artifact]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
          flavor: |
            latest=${{ needs.check-version.outputs.latest }}
          labels: |
            org.opencontainers.image.url=https://naver.github.io/p2pcp/

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          build-args: |
            BUILD_VERSION=${{ needs.check-version.outputs.short-sha }}

  verify-image:
    needs: [check-version, build-and-push-image]
    # Each runner pulls and runs the image variant for its own platform.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions: {}
    steps:
      - name: Pull and run the published image anonymously
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
          EXPECTED: p2pcp-${{ needs.check-version.outputs.version }}+${{ needs.check-version.outputs.short-sha }}
        run: |
          image="ghcr.io/${REPO,,}:${TAG}"
          # Fails when the package is not public, e.g. if an organization policy keeps new packages private.
          if ! docker pull "$image"; then
            echo "::error::anonymous pull of $image failed. Make sure the package is public, then re-run the failed jobs."
            exit 1
          fi
          actual=$(docker run --rm "$image" -version 2>&1)
          echo "$actual"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::published image reports '$actual', expected '$EXPECTED'"
            exit 1
          fi

  update-release-notes:
    needs: [deploy, verify-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Append container image and binary info to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          BODY=$(gh release view "$VERSION" --json body --jq .body --repo "$REPO")

          # Idempotent: skip if already updated
          if echo "$BODY" | grep -q "## Container Images"; then
            echo "Release notes already contain Container Images section. Skipping."
            exit 0
          fi

          REPO_LOWER=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')

          {
            echo "$BODY"
            echo ""
            echo "## Container Images"
            echo ""
            echo '```bash'
            echo "docker pull ghcr.io/${REPO_LOWER}:${VERSION}"
            echo '```'
            echo ""
            echo "Supported platforms: \`linux/amd64\`, \`linux/arm64\`"
          } > /tmp/notes.md

          gh release edit "$VERSION" --notes-file /tmp/notes.md --repo "$REPO"
